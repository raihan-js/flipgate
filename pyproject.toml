[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flipgate"
version = "0.1.0"
description = "Release gate for quantised/re-served LLMs based on per-item answer flips"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Raihan Sikder", email = "raihan@example.com"}
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "vllm>=0.2.7",
    "datasets>=2.16.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "mlflow>=2.9.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
llamacpp = [
    "llama-cpp-python>=0.2.0",
]

[project.scripts]
flipgate = "flipgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
