name: FlipGate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        # Install the package itself (not a hardcoded dep list) so CI can
        # never drift from pyproject.toml again. This exact drift broke CI:
        # langdetect was added to pyproject but not to this list, failing
        # test_kannada_pass on all versions while passing locally.
        run: |
          pip install -e ".[dev]"
      
      - name: Run tests
        run: |
          PYTHONPATH=src pytest tests/ -v --tb=short
      
      - name: Test CLI
        run: |
          PYTHONPATH=src python -m flipgate.cli --help
          PYTHONPATH=src python -m flipgate.cli info
